<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161616'/%3E%3Cpath d='M9 24 16 8l7 16M12.6 18.4h6.8' fill='none' stroke='%23fafafa' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Agentique Console</title>
    <!--
      Theme before first paint. Blocking on purpose and deliberately tiny: if
      React decided this, every reload would flash the wrong theme. Dark is the
      fallback because it is the console's home. The storage key is mirrored in
      src/stores/theme.ts as THEME_STORAGE_KEY.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("console:theme");
          var dark =
            stored === "dark" ||
            ((stored === null || stored === "system") &&
              !window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
